<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something went wrong</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --border: #262b36;
        --text: #e8eaed;
        --muted: #9aa3b2;
        --accent: #ff5c5c;
        --accent-soft: rgba(255, 92, 92, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: radial-gradient(
            1200px 600px at 50% -10%,
            #1b2030 0%,
            var(--bg) 60%
          )
          var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 30rem;
        padding: 2.25rem 2rem 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.04) inset,
          0 20px 50px -20px rgba(0, 0, 0, 0.8);
        text-align: center;
        animation: rise 0.35s ease-out both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .icon {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        border-radius: 50%;
        background: var(--accent-soft);
        border: 1px solid rgba(255, 92, 92, 0.3);
        color: var(--accent);
      }

      .icon svg {
        width: 32px;
        height: 32px;
      }

      h1 {
        font-size: 1.375rem;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        font-size: 0.9375rem;
        color: var(--muted);
        margin-bottom: 1.5rem;
      }

      .message {
        padding: 0.875rem 1rem;
        background: #10131a;
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8125rem;
        line-height: 1.6;
        color: #d7dbe3;
        text-align: left;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .actions {
        margin-top: 1.5rem;
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 550;
        padding: 0.625rem 1.25rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.05s ease;
      }

      button:hover {
        background: #1e232d;
        border-color: #333a47;
      }

      button:active {
        transform: translateY(1px);
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      button.primary:hover {
        background: #ff6e6e;
        border-color: #ff6e6e;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="alert" aria-live="assertive">
      <div class="icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9" />
          <line x1="12" y1="8" x2="12" y2="13" />
          <line x1="12" y1="16.5" x2="12" y2="16.5" />
        </svg>
      </div>

      <h1>Something went wrong</h1>
      <p class="subtitle">The request could not be completed.</p>

      <div class="message" id="errorMessage">No details were provided.</div>

      <div class="actions">
        <button class="primary" type="button" onclick="location.reload()">
          Try again
        </button>
        <button type="button" onclick="history.back()">Go back</button>
      </div>
    </main>

    <script>
      const raw = window.location.href.split("?").slice(1).join("?");

      let errorMessage = "";
      try {
        errorMessage = raw ? decodeURIComponent(raw) : "";
      } catch {
        errorMessage = raw; // malformed escape sequence — show it raw
      }

      const el = document.getElementById("errorMessage");

      if (errorMessage.trim()) {
        // textContent — never innerHTML — so URL content can't inject markup
        el.textContent = errorMessage;
      } else {
        el.textContent = "No details were provided.";
        el.style.color = "var(--muted)";
        el.style.fontStyle = "italic";
      }

      console.log(errorMessage);
    </script>
  </body>
</html>
